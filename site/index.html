<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hundred Days</title>
<meta name="description" content="Three people, 100 days, one post each per day: a hook, a bass line, and a vocal.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hundred Days">
<meta property="og:title" content="Hundred Days">
<meta property="og:description" content="A hook, a bass line, and a vocal, every day, for 100 days. Bobby, Jason, and Drew.">
<meta property="og:url" content="https://bomatson.github.io/hundred-days/">
<meta property="og:image" content="https://bomatson.github.io/hundred-days/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Hundred Days: three sequencer lanes, a hook, a bass line, and a vocal">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hundred Days">
<meta name="twitter:description" content="A hook, a bass line, and a vocal, every day, for 100 days.">
<meta name="twitter:image" content="https://bomatson.github.io/hundred-days/og.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>
<main>
  <header class="top">
    <a class="wordmark" href="./">Hundred Days</a>
    <div class="right"><div class="today" id="today"></div><a class="post-btn" href="upload/">Post</a></div>
  </header>

  <section class="seq" aria-label="Progress">
    <h1 id="headline">Hundred Days</h1>
    <div id="lanes"></div>
  </section>

  <section class="feed" aria-label="Posts">
    <div class="feed-head"><h2 id="feed-title">Posts</h2></div>
    <div id="feed"></div>
  </section>

  <footer>
    <span>One post per person per day, for 100 days.</span>
    <span><a href="upload/">Post from your phone</a> &nbsp; <a href="https://github.com/bomatson/hundred-days">Rules and source</a></span>
  </footer>
</main>

<script src="streaks.js"></script>
<script src="player.js"></script>
<script>
(async function () {
  const S = window.Streaks, HD = window.HD;
  const data = await HD.load();
  const colors = HD.colors(data);
  const esc = HD.esc;

  const todayDay = S.dayNumber(data.start_date, S.localToday());
  const dayDate = HD.dayDate(data);

  // top line + headline
  document.getElementById("today").innerHTML = HD.topLine(data, todayDay);
  const h1 = document.getElementById("headline");
  if (todayDay < 1) {
    const n = 1 - todayDay;
    h1.innerHTML = `${n === 1 ? "Tomorrow" : n + " days"} <small>until day one. A hook, a bass line, and a vocal, every day, for a hundred days.</small>`;
  } else if (todayDay > data.days) {
    h1.innerHTML = `One hundred days. <small>Started ${dayDate(1, { month: "long", day: "numeric", year: "numeric" })}.</small>`;
  } else {
    h1.innerHTML = `Day ${todayDay} <small>${dayDate(todayDay, { weekday: "long", month: "long", day: "numeric" })}. ${data.days - todayDay} to go.</small>`;
  }

  // lanes
  const lanes = document.getElementById("lanes");
  for (const p of data.participants) {
    const s = S.stats(data.posts, p.id, todayDay, data.days);
    const lane = document.createElement("div");
    lane.className = "lane";
    lane.style.setProperty("--c", colors[p.id]);
    const steps = s.cells.map((c) => {
      const tip = c.state === "posted" ? `Day ${c.day}, posted` : c.state === "missed" ? `Day ${c.day}, missed` : c.state === "today" ? `Day ${c.day}, today` : `Day ${c.day}`;
      return `<div class="step ${c.state}" data-tip="${tip}"></div>`;
    }).join("");
    let flag = "";
    if (todayDay >= 1 && todayDay <= data.days) {
      flag = s.postedToday ? `<span class="flag">Posted today</span>` : `<span class="flag muted">Not yet today</span>`;
    }
    lane.innerHTML = `
      <div class="who"><div class="name">${esc(p.name)}</div><div class="makes">${esc(p.makes)}</div></div>
      <div class="steps" role="img" aria-label="${esc(p.name)}: ${s.total} posts, ${s.current} day streak">${steps}</div>
      <div class="nums">
        <span><b>${s.current}</b>day streak</span>
        <span><b>${s.longest}</b>best</span>
        <span><b>${s.total}</b>posts</span>
        ${flag}
      </div>`;
    lanes.appendChild(lane);
  }
  const axis = document.createElement("div");
  axis.className = "lane"; axis.style.border = "0"; axis.style.padding = "0";
  axis.innerHTML = `<div></div><div class="axis"><span>1</span><span>25</span><span>50</span><span>75</span><span>100</span></div>`;
  lanes.appendChild(axis);

  // feed: newest day first, each day links to its own page
  const feed = document.getElementById("feed");
  const byDay = new Map();
  for (const post of data.posts) {
    if (!byDay.has(post.day)) byDay.set(post.day, []);
    byDay.get(post.day).push(post);
  }
  document.getElementById("feed-title").textContent = byDay.size ? `${data.posts.length} posts` : "Posts";
  if (!byDay.size) {
    feed.innerHTML = todayDay < 1
      ? `<div class="empty-state"><b>Nothing here yet.</b> The first posts land on ${dayDate(1, { weekday: "long", month: "long", day: "numeric" })}.</div>`
      : `<div class="empty-state"><b>Nothing posted yet.</b> Day ${todayDay} is open.</div>`;
  }
  for (const day of [...byDay.keys()].sort((a, b) => b - a)) {
    const row = document.createElement("div");
    row.className = "day";
    row.innerHTML = `
      <div class="head">
        <a class="n" href="day/${day}/">Day ${day}</a>
        <div class="d">${dayDate(day, { weekday: "short", month: "short", day: "numeric" })}</div>
        <button class="btn ghost small share" type="button">Share</button>
      </div>
      <div class="posts">${HD.renderDay(data, colors, byDay.get(day), day, todayDay)}</div>`;
    feed.appendChild(row);
    HD.mountPlayers(row);
    HD.shareButton(row.querySelector(".share"), HD.dayUrl(day), `Hundred Days, day ${day}`);
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hundred Days</title>
<style>
  :root {
    --bg: #0e0f12; --panel: #17191e; --line: #272a31; --text: #e8e6e1; --muted: #8b8f98;
    --bobby: #ffb347; --jason: #5ac8fa; --missed: #3a2326; --future: #1d1f25; --today: #2a2d35;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .sub b { color: var(--text); }
  .people { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 40px; }
  @media (min-width: 720px) { .people { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .card h2 .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .card .makes { color: var(--muted); font-size: 14px; margin: 2px 0 14px; }
  .nums { display: flex; gap: 20px; margin-bottom: 14px; }
  .nums div { line-height: 1.1; }
  .nums .n { font-size: 32px; font-weight: 700; }
  .nums .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .fire { font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .cell { aspect-ratio: 1; border-radius: 3px; background: var(--future); position: relative; }
  .cell.missed { background: var(--missed); }
  .cell.today { background: var(--today); outline: 2px dashed var(--muted); outline-offset: -2px; }
  .cell.posted { background: var(--c); }
  .cell[title]:hover::after { content: attr(title); position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
    background: #000; color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; z-index: 2; }
  .legend { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend .lp::before { background: var(--c); }
  .legend .lm::before { background: var(--missed); }
  .legend .lf::before { background: var(--future); }
  .status { font-size: 13px; margin-top: 10px; color: var(--muted); }
  .status.ok { color: #7ed98b; }
  h3.feed { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 12px; }
  .day { border-top: 1px solid var(--line); padding: 18px 0; display: grid; grid-template-columns: 90px 1fr; gap: 12px; }
  .day .num { font-size: 22px; font-weight: 700; line-height: 1; }
  .day .date { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .post { margin-bottom: 12px; }
  .post:last-child { margin-bottom: 0; }
  .post .who { font-weight: 600; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .post .who .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .post .who .meta { color: var(--muted); font-weight: 400; font-size: 13px; }
  .post audio { width: 100%; max-width: 520px; display: block; }
  .post .note { color: var(--muted); font-size: 14px; margin-top: 4px; white-space: pre-wrap; }
  .post .none { color: var(--muted); font-size: 14px; font-style: italic; }
  .empty { color: var(--muted); padding: 24px 0; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">Hundred Days</h1>
  <p class="sub" id="sub">Loading…</p>
  <section class="people" id="people"></section>
  <h3 class="feed">Posts</h3>
  <section id="feed"></section>
  <footer>One post per person per day, 100 days. <a id="repo" href="#">Source and rules</a></footer>
</main>
<script src="streaks.js"></script>
<script>
(async function () {
  const colors = { bobby: "var(--bobby)", jason: "var(--jason)" };
  const fallback = ["#ffb347", "#5ac8fa", "#c084fc", "#7ed98b"];
  const res = await fetch("posts.json", { cache: "no-store" });
  const data = await res.json();
  const S = window.Streaks;
  const todayDay = S.dayNumber(data.start_date, S.localToday());
  const shown = Math.min(Math.max(todayDay, 0), data.days);
  const names = Object.fromEntries(data.participants.map((p) => [p.id, p.name]));
  data.participants.forEach((p, i) => { if (!colors[p.id]) colors[p.id] = fallback[i % fallback.length]; });

  document.getElementById("title").textContent = data.title;
  const sub = document.getElementById("sub");
  if (todayDay < 1) sub.innerHTML = `Starts <b>${data.start_date}</b> · ${-todayDay + 1} day${todayDay === 0 ? "" : "s"} to go`;
  else if (todayDay > data.days) sub.innerHTML = `<b>Done.</b> ${data.days} days, started ${data.start_date}`;
  else sub.innerHTML = `Today is <b>day ${todayDay}</b> of ${data.days} · started ${data.start_date}`;

  const people = document.getElementById("people");
  for (const p of data.participants) {
    const s = S.stats(data.posts, p.id, todayDay, data.days);
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--c", colors[p.id]);
    const cells = s.cells.map((c) => `<div class="cell ${c.state}" title="Day ${c.day}: ${c.state}"></div>`).join("");
    const status = todayDay < 1 ? "" : todayDay > data.days ? "" :
      s.postedToday ? `<div class="status ok">Posted today ✓</div>` : `<div class="status">Not posted yet today</div>`;
    card.innerHTML = `
      <h2><span class="dot" style="background:${colors[p.id]}"></span>${p.name}</h2>
      <div class="makes">${p.makes} every day</div>
      <div class="nums">
        <div><div class="n"><span class="fire">🔥</span>${s.current}</div><div class="l">current streak</div></div>
        <div><div class="n">${s.longest}</div><div class="l">longest</div></div>
        <div><div class="n">${s.total}</div><div class="l">posts</div></div>
      </div>
      <div class="grid">${cells}</div>
      <div class="legend"><span class="lp">posted</span><span class="lm">missed</span><span class="lf">upcoming</span></div>
      ${status}`;
    people.appendChild(card);
  }

  const feed = document.getElementById("feed");
  const byDay = new Map();
  for (const post of data.posts) {
    if (!byDay.has(post.day)) byDay.set(post.day, []);
    byDay.get(post.day).push(post);
  }
  if (byDay.size === 0) feed.innerHTML = `<div class="empty">Nothing posted yet.</div>`;
  const fmt = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
  const dayDate = (d) => new Date(S.parseDate(data.start_date) + (d - 1) * 86400000)
    .toLocaleDateString(undefined, { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" });
  for (const day of [...byDay.keys()].sort((a, b) => b - a)) {
    const posts = byDay.get(day);
    const row = document.createElement("div");
    row.className = "day";
    const items = data.participants.map((p) => {
      const post = posts.find((x) => x.who === p.id);
      const who = `<div class="who"><span class="dot" style="background:${colors[p.id]}"></span>${p.name}` +
        (post ? ` <span class="meta">${p.makes}${post.posted_at ? " · " + fmt(post.posted_at) : ""}</span>` : "") + `</div>`;
      if (!post) return `<div class="post">${who}<div class="none">no post</div></div>`;
      const note = post.note ? `<div class="note">${post.note.replace(/</g, "&lt;")}</div>` : "";
      return `<div class="post">${who}<audio controls preload="none" src="${post.file}" type="${post.mime}"></audio>${note}</div>`;
    }).join("");
    row.innerHTML = `<div><div class="num">Day ${day}</div><div class="date">${dayDate(day)}</div></div><div>${items}</div>`;
    feed.appendChild(row);
  }
  document.getElementById("repo").href = "https://github.com/bomatson/hundred-days";
})();
</script>
</body>
</html>

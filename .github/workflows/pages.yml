name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Release the day's held posts (see scripts/build.py). Cron is UTC; New York is UTC-5
    # for the rest of the challenge, so these run at 00:07 and 01:07 there. The second
    # run covers a skipped or late first one.
    - cron: "7 5 * * *"
    - cron: "7 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Waveform cache
        uses: actions/cache@v4
        with:
          path: .peaks-cache
          key: peaks-${{ hashFiles('audio/**') }}
          restore-keys: peaks-
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Run tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v && node --test site/streaks.test.js site/player.test.js worker/test.mjs
      - name: Build site
        run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

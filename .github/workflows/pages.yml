name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Release the day's held posts (see scripts/build.py): just after midnight in New York,
    # and once more an hour later in case GitHub skipped or delayed the first run.
    - cron: "7 0 * * *"
      timezone: "America/New_York"
    - cron: "7 1 * * *"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. PR checks get their own group, so a waiting scheduled run is not
# bumped by a PR check (GitHub keeps only one pending run per group).
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # the ffmpeg apt install hung for an hour on 2026-11-11 and held the post back all day
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Waveform cache
        uses: actions/cache@v4
        with:
          path: .peaks-cache
          key: peaks-${{ hashFiles('audio/**') }}
          restore-keys: peaks-
      # The runner image (ubuntu 26.04) has no ffmpeg. On 2026-11-11 apt could not resolve
      # security.ubuntu.com and hung for an hour, twice, so the day's post stayed unpublished.
      # Order now: cached static binary, GitHub-hosted static build, apt last, each with a time limit.
      # A build with no ffmpeg still publishes; the new post then has no waveform until a later build.
      - name: ffmpeg cache
        uses: actions/cache@v4
        with:
          path: ~/.ffmpeg
          key: ffmpeg-static-n8.1-linux64
      - name: ffmpeg
        continue-on-error: true
        timeout-minutes: 8
        run: |
          mkdir -p ~/.ffmpeg
          if [ ! -x ~/.ffmpeg/ffmpeg ]; then
            url=https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 -o /tmp/ffmpeg.tar.xz "$url" \
              && tar -xJf /tmp/ffmpeg.tar.xz --strip-components=2 -C ~/.ffmpeg --wildcards '*/bin/ffmpeg' \
              || echo "::warning::static ffmpeg download failed, trying apt"
          fi
          if [ -x ~/.ffmpeg/ffmpeg ]; then
            echo "$HOME/.ffmpeg" >> "$GITHUB_PATH"
            ~/.ffmpeg/ffmpeg -version | head -1
            exit 0
          fi
          which ffmpeg && exit 0
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          $APT update && $APT install -y --no-install-recommends ffmpeg
      - name: Run tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v && node --test site/streaks.test.js site/player.test.js worker/test.mjs
      - name: Build site
        run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30   # covers the 20 min deploy-pages timeout below plus setup
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000   # ms. Pages took ~10 min to sync on 2026-11-09 and the default 600000 timed out.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Release the day's held posts (see scripts/build.py): just after midnight in New York,
    # and once more an hour later in case GitHub skipped or delayed the first run.
    - cron: "7 0 * * *"
      timezone: "America/New_York"
    - cron: "7 1 * * *"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. PR checks get their own group, so a waiting scheduled run is not
# bumped by a PR check (GitHub keeps only one pending run per group).
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Waveform cache
        uses: actions/cache@v4
        with:
          path: .peaks-cache
          key: peaks-${{ hashFiles('audio/**') }}
          restore-keys: peaks-
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Run tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v && node --test site/streaks.test.js site/player.test.js worker/test.mjs
      - name: Build site
        run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000   # ms. Pages took ~10 min to sync on 2026-11-09 and the default 600000 timed out.

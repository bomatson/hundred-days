name: Retry a failed deploy

# A push or scheduled "Build and deploy" run that fails gets one more try, twice at most.
# Pages deploys have timed out (2026-11-09) and runners have lost DNS (2026-11-11); a plain
# rerun fixed both by hand. PR checks are left alone.

on:
  workflow_run:
    workflows: ["Build and deploy"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event != 'pull_request'
      && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rerun the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          echo "run $RUN_ID failed on attempt $ATTEMPT; waiting two minutes, then rerunning its failed jobs"
          sleep 120
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
